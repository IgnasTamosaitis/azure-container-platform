name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/ignastamosaitis/azure-container-platform
  APP_NAME: ca-container-api-dev
  RESOURCE_GROUP: rg-container-platform-dev

jobs:
  build:
    name: Test, build, scan and publish
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write          # push to GHCR (only used on main)
      security-events: write   # upload Trivy results to the Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies (hash-locked)
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME:sha-${{ github.sha }}" .

      # Scan the exact image that will be published. Fails on fixable HIGH/CRITICAL CVEs.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true

      - name: Upload Trivy results
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the same image that was tested and scanned, instead of rebuilding it
      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        run: |
          docker tag "$IMAGE_NAME:sha-${{ github.sha }}" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:sha-${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

  deploy:
    name: Deploy to Azure Container Apps
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Deploy new Docker image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none

          DEPLOYED_IMAGE="$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query 'properties.template.containers[0].image' \
            -o tsv | tr -d '\r\n')"

          test "$DEPLOYED_IMAGE" = "$IMAGE"
          echo "Configured image: $DEPLOYED_IMAGE"

      - name: Verify API health
        run: |
          FQDN="$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query 'properties.configuration.ingress.fqdn' \
            -o tsv | tr -d '\r\n')"

          curl --fail --silent --show-error \
            --retry 8 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 20 \
            "https://${FQDN}/health"
