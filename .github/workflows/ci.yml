name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t azure-container-api:ci .

  publish:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ignastamosaitis/azure-container-platform:latest
            ghcr.io/ignastamosaitis/azure-container-platform:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/IgnasTamosaitis/azure-container-platform

  deploy:
    name: Deploy to Azure Container Apps
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Deploy new Docker image
        env:
          IMAGE: ghcr.io/ignastamosaitis/azure-container-platform:sha-${{ github.sha }}
        run: |
          az containerapp update \
            --name ca-container-api-dev \
            --resource-group rg-container-platform-dev \
            --image "$IMAGE" \
            --output none

          DEPLOYED_IMAGE="$(az containerapp show \
            --name ca-container-api-dev \
            --resource-group rg-container-platform-dev \
            --query 'properties.template.containers[0].image' \
            -o tsv | tr -d '\r\n')"

          test "$DEPLOYED_IMAGE" = "$IMAGE"
          echo "Configured image: $DEPLOYED_IMAGE"

      - name: Verify API health
        run: |
          FQDN="$(az containerapp show \
            --name ca-container-api-dev \
            --resource-group rg-container-platform-dev \
            --query 'properties.configuration.ingress.fqdn' \
            -o tsv | tr -d '\r\n')"

          curl --fail --silent --show-error \
            --retry 8 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 20 \
            "https://${FQDN}/health"
