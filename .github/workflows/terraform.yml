name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  schedule:
    - cron: '0 6 * * 1'   # weekly drift check, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: 1.16.4
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: terraform

jobs:
  static-checks:
    name: Format, validate and scan
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate

      # Infrastructure misconfiguration scan; fails on HIGH/CRITICAL findings
      - name: Scan Terraform with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-terraform.sarif
          limit-severities-for-sarif: true

      - name: Upload Trivy results
        if: always() && hashFiles('trivy-terraform.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-terraform.sarif
          category: trivy-terraform

  plan:
    name: Plan
    needs: static-checks
    # Opt-in: plan only runs when Azure infrastructure exists (set TF_PLAN_ENABLED=true).
    # PRs from forks get no OIDC token, so only plan for branches in this repo.
    if: >-
      vars.TF_PLAN_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    # Read-only identity: Reader on the app resource group + blob access to the state container
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -lock-timeout=120s -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = no changes, 2 = changes present, anything else = error
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi

      - name: Write plan summary
        run: |
          {
            echo "### Terraform plan"
            echo
            grep -E '^(Plan:|No changes\.)' plan.txt || echo "See job log for details."
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file summary.md --edit-last --create-if-none

      # On the weekly schedule, any planned change means the live infrastructure has drifted from code
      - name: Fail on drift
        if: github.event_name == 'schedule' && steps.plan.outputs.exitcode == '2'
        run: |
          echo "::error::Drift detected: Azure no longer matches the Terraform configuration."
          exit 1
